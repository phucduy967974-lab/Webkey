        /* CARD RỘNG & DÀI: tăng chiều cao bằng padding và margin */
        .duy-card {
            position: relative;
            background: #0f0f0f;
            border-radius: 2rem;
            border: 2.5px solid #d62828;
            box-shadow: 0 15px 35px -10px rgba(214, 40, 40, 0.4), 0 0 0 1px rgba(214, 40, 40, 0.25);
            width: 100%;
            max-width: 650px;

            overflow: hidden;
            transition: all 0.2s;

        /* Dao trang trí - vẫn nằm gọn trong viền */
        .knife-deco {
            position: absolute;
            font-size: 1.2rem;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5));
            pointer-events: none;
            z-index: 1;
            opacity: 0.65;
            color: #bbb;
        }
        .knife-1 { top: 18px; left: 18px; transform: rotate(-22deg); }
        .knife-2 { top: 18px; right: 18px; transform: rotate(22deg); }
        .knife-3 { bottom: 18px; left: 18px; transform: rotate(18deg); }
        .knife-4 { bottom: 18px; right: 18px; transform: rotate(-18deg); }
        .knife-5 { top: 50%; left: 12px; transform: translateY(-50%) rotate(-10deg); font-size: 1.1rem; opacity: 0.55; }
        .knife-6 { top: 50%; right: 12px; transform: translateY(-50%) rotate(10deg); font-size: 1.1rem; opacity: 0.55; }

        .action-buttons {

        .datetime-area {
            text-align: center;
            margin-top: 1.4rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(214, 64, 49, 0.4);
        }
        .date-text {
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(120deg, #ff9a7a, #ff6b5b);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .clock-text {
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 700;
            background: #1f1f1f;
            display: inline-block;
            padding: 0.4rem 1.5rem;
            border-radius: 50px;
            color: #ffaa99;
            margin-top: 10px;
            letter-spacing: 1.5px;
            border: 0.5px solid #d43f31;

        .footer {
            margin-top: 1.6rem;
            text-align: center;
            font-size: 0.75rem;
            color: #a87c6f;
            font-weight: 500;
        }
        .footer a {
            color: #ff7a62;

            font-weight: 700;
            transition: color 0.2s;
        }
        .footer a:hover {
            color: #ffb4a2;
            text-decoration: underline;
        }

        .toast-msg {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #1f1b1ae6;
            backdrop-filter: blur(10px);
            color: #ffdad2;
            padding: 0.5rem 1.4rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 999;
            opacity: 0;
            transition: 0.12s;
            pointer-events: none;
            white-space: nowrap;
            border-left: 3px solid #d62828;
            font-family: monospace;
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

    <script>
        const keyField = document.getElementById('keyInput');
        const copyBtn = document.getElementById('copyBtn');
        const musicAudio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const clockSpan = document.getElementById('clock');
        const dateSpan = document.getElementById('dateDisplay');
        const toastEl = document.getElementById('toastMsg');

        let toastTimeout;
        function showToast(msg, isErr = false) {
            if (toastTimeout) clearTimeout(toastTimeout);
            toastEl.textContent = msg || (isErr ? '⚠️ Lỗi thao tác' : '✅ Đã sao chép');
            toastEl.classList.add('show');
            toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 1500);
        }

        function loadKeyFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const key = params.get('ma');
            if (key && key.trim() !== "") {
                keyField.value = key.trim();
            } else {
                keyField.value = '🔪 KHÔNG CÓ KEY 🔪';
            }
        }

        async function copyKey() {
            const val = keyField.value;
            if (!val || val === '🔪 KHÔNG CÓ KEY 🔪' || val === 'Đang tải...') {
                showToast('❗ Không có key để copy', true);
                return;
            }
            try {
                await navigator.clipboard.writeText(val);
                showToast(`📋 ${val}`, false);
                keyField.style.transform = 'scale(0.98)';
                setTimeout(() => keyField.style.transform = '', 150);
            } catch (err) {
                keyField.select();
                const copied = document.execCommand('copy');
                if (copied) showToast('✅ Đã copy', false);
                else showToast('❌ Copy thất bại', true);
                keyField.blur();
            }
        }

        function updateDateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            clockSpan.textContent = `${hours}:${minutes}:${seconds}`;
            const day = now.getDate();
            const month = now.getMonth() + 1;
            const year = now.getFullYear();
            dateSpan.textContent = `${day}/${month}/${year}`;
            document.title = `🗝️ Duy Key | ${day}/${month} - Dài`;
            setTimeout(updateDateTime, 1000);
        }

        function toggleMusic() {
            if (musicAudio.paused) {
                musicAudio.play().then(() => {
                    musicBtn.innerHTML = '⏸️ TẮT NHẠC';
                    showToast('🎵 Đang phát nhạc nền', false);
                }).catch(() => {
                    showToast('🔇 Không thể phát nhạc', true);
                    musicBtn.innerHTML = '🎵 NHẠC NỀN';
                });
            } else {
                musicAudio.pause();
                musicBtn.innerHTML = '🎵 NHẠC NỀN';
                showToast('🔇 Đã tắt nhạc', false);
            }
        }

        musicAudio.addEventListener('play', () => musicBtn.innerHTML = '⏸️ TẮT NHẠC');
        musicAudio.addEventListener('pause', () => musicBtn.innerHTML = '🎵 NHẠC NỀN');
        musicAudio.addEventListener('error', () => {
            musicBtn.innerHTML = '🎵 LỖI AUDIO';
        });

        copyBtn.addEventListener('click', copyKey);
        musicBtn.addEventListener('click', toggleMusic);
        keyField.addEventListener('dblclick', copyKey);

        loadKeyFromUrl();
        updateDateTime();
    </script>
