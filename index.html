<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Ngày Hôm Nay Là</title>
    <!-- Font Awesome cho icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Font: Space Grotesk (hiện đại, tech) -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(ellipse at top, #0b0d1e, #030514);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng sao nền (tinh tế) */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(2px 2px at 15px 60px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 72px 430px, #ffb3b3, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 250px 120px, #b3d9ff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 180px 380px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 530px 90px, #c2b3ff, rgba(0,0,0,0)),
                radial-gradient(4px 4px at 800px 200px, #b3ffd9, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 900px 500px, #ffb3d9, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 1200px 300px, #ffffb3, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 1400px 650px, #ffb3b3, rgba(0,0,0,0));
            background-repeat: no-repeat;
            opacity: 0.4;
            pointer-events: none;
        }

        .cosmic-card {
            width: 100%;
            max-width: 520px;
            background: rgba(18, 22, 38, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 42px;
            padding: 40px 32px;
            box-shadow: 0 30px 60px -15px rgba(0, 255, 255, 0.3),
                        0 0 0 1px rgba(0, 255, 255, 0.1) inset,
                        0 0 30px rgba(0, 180, 255, 0.2);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            z-index: 2;
        }

        .cosmic-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 40px 80px -10px cyan, 0 0 0 2px cyan inset, 0 0 50px cyan;
            border-color: transparent;
        }

        /* Hiệu ứng viền sáng chạy (khác biệt hoàn toàn với pulse cũ) */
        .cosmic-card::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(120deg, #00ffff, #ff00ff, #ffff00, #00ffff);
            border-radius: 44px;
            z-index: -1;
            background-size: 300% 300%;
            opacity: 0;
            transition: opacity 0.6s;
        }

        .cosmic-card:hover::after {
            opacity: 0.7;
            animation: borderFlow 3s ease infinite;
        }

        @keyframes borderFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-icon {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-icon i {
            font-size: 3.5rem;
            color: cyan;
            filter: drop-shadow(0 0 15px cyan);
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; text-shadow: 0 0 20px cyan; }
            50% { opacity: 0.8; text-shadow: 0 0 40px magenta; }
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 600;
            text-align: center;
            background: linear-gradient(135deg, #a0f0ff, #ffa0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subhead {
            text-align: center;
            color: rgba(200, 230, 255, 0.8);
            font-weight: 300;
            font-size: 0.95rem;
            margin-bottom: 30px;
            border-bottom: 1px dashed cyan;
            padding-bottom: 15px;
        }

        .key-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .key-input-wrapper {
            width: 100%;
            position: relative;
        }

        .key-input-wrapper i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: cyan;
            font-size: 1.3rem;
            opacity: 0.8;
        }

        #keyInput {
            width: 100%;
            padding: 18px 20px 18px 55px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #fff;
            letter-spacing: 1.5px;
            text-align: left;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        #keyInput:focus {
            outline: none;
            border-color: magenta;
            box-shadow: 0 0 30px magenta;
        }

        #keyInput::placeholder {
            color: rgba(255,255,255,0.3);
            font-weight: 300;
            letter-spacing: 0px;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            width: 100%;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid rgba(0, 255, 255, 0.5);
            color: cyan;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            flex: 1 1 160px;
        }

        .action-btn i {
            font-size: 1.2rem;
        }

        .action-btn:hover {
            background: cyan;
            color: #0a0e1e;
            border-color: magenta;
            box-shadow: 0 0 40px magenta;
            transform: scale(1.02);
        }

        /* Nút music riêng một màu sắc để phân biệt */
        #musicButton {
            border-color: rgba(255, 0, 255, 0.5);
            color: #ffa0ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
        }

        #musicButton:hover {
            background: magenta;
            color: #0a0e1e;
            border-color: cyan;
            box-shadow: 0 0 40px cyan;
        }

        .datetime {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 80px;
            padding: 10px 18px;
            margin: 30px 0 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        .date-box, .time-box {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-weight: 400;
            font-size: 1rem;
        }

        .date-box i, .time-box i {
            color: cyan;
            font-size: 1.2rem;
            filter: drop-shadow(0 0 5px cyan);
        }

        .date-box span, .time-box span {
            background: rgba(0, 255, 255, 0.15);
            padding: 5px 15px;
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            font-weight: 500;
        }

        .time-box span {
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px 20px;
            color: #aaa;
            font-size: 0.9rem;
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            padding-top: 22px;
            margin-top: 10px;
        }

        .footer a {
            color: cyan;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px dotted cyan;
            transition: 0.2s;
        }

        .footer a:hover {
            color: magenta;
            border-bottom-color: magenta;
        }

        .footer i {
            margin-right: 4px;
            color: cyan;
        }

        #clock {
            font-weight: 600;
            background: rgba(0, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid cyan;
        }
    </style>
</head>
<body>

    <div class="cosmic-card">
        <div class="header-icon">
            <i class="fas fa-key"></i>
        </div>
        <h1>KEY GENERATOR</h1>
        <div class="subhead">nhập mã bí mật · nhận key</div>

        <div class="key-area">
            <div class="key-input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="text" id="keyInput" readonly placeholder="Đang kết nối...">
            </div>
            <div class="button-group">
                <button class="action-btn" onclick="copyToClipboard()">
                    <i class="fas fa-copy"></i> COPY KEY
                </button>
                <button class="action-btn" id="musicButton" onclick="toggleMusic()">
                    <i class="fas fa-play"></i> PLAY MUSIC
                </button>
            </div>
        </div>

        <div class="datetime">
            <div class="date-box">
                <i class="fas fa-calendar-alt"></i>
                <span id="dateDisplay">--/--/----</span>
            </div>
            <div class="time-box">
                <i class="fas fa-clock"></i>
                <span id="clock">00:00:00</span>
            </div>
        </div>

        <div class="footer">
            <span><i class="fas fa-copyright"></i> <b>Nguyễn Duy Khánh</b></span>
            <a href="https://zalo.me/0822771058" target="_blank"><i class="fas fa-phone-alt"></i> Zalo</a>
            <span><i class="fas fa-satellite"></i> <span id="clockFooter">00:00:00</span></span>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const timeString = `${hours}:${minutes}:${seconds}`;
            
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const dateString = `Ngày ${day}/${month}/${year}`;

            // Cập nhật cả 2 đồng hồ (trong time-box và footer)
            document.getElementById("clock").innerText = timeString;
            document.getElementById("clockFooter").innerText = timeString;
            document.getElementById("dateDisplay").innerText = dateString;
            document.title = `Key Ngày ${day}/${month}/${year} Là`;

            setTimeout(updateTime, 1000);
        }

        function getQueryParam() {
            const urlParams = new URLSearchParams(window.location.search);
            const key = urlParams.get('ma');
            const keyInput = document.getElementById('keyInput');
            keyInput.value = key ? key : 'No key found';
        }

        function copyToClipboard() {
            const keyInput = document.getElementById('keyInput');
            keyInput.select();
            document.execCommand('copy');
            // Thông báo nhẹ nhàng (có thể thay alert bằng toast nếu muốn, nhưng giữ alert)
            alert('🔐 Key copied: ' + keyInput.value);
        }

        function toggleMusic() {
            const music = document.getElementById('backgroundMusic');
            const musicButton = document.getElementById('musicButton');
            const icon = musicButton.querySelector('i');

            if (music.paused) {
                music.play().catch(e => console.warn('Autoplay bị chặn:', e));
                musicButton.innerHTML = '<i class="fas fa-pause"></i> PAUSE MUSIC';
            } else {
                music.pause();
                musicButton.innerHTML = '<i class="fas fa-play"></i> PLAY MUSIC';
            }
        }

        window.onload = function () {
            updateTime();
            getQueryParam();
            // Đồng bộ nút nhạc (nếu nhạc chưa chạy)
            const music = document.getElementById('backgroundMusic');
            if (music.paused) {
                document.getElementById('musicButton').innerHTML = '<i class="fas fa-play"></i> PLAY MUSIC';
            }
        };
    </script>
</body>
